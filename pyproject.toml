[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accreditation-research-agent"
version = "1.1.2"
description = "UGC / AICTE accreditation research engine with hyperlinked proof PDFs"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.7,<3", "httpx>=0.27", "pymupdf>=1.24",
  "rapidfuzz>=3.6", "playwright>=1.44", "openai>=1.40",
]

[tool.setuptools]
packages = ["accreditation_engine", "accreditation_engine.sources", "accreditation_engine.evidence"]
